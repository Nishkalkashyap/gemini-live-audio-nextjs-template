<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Realtime Audio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="conversation-panel" aria-label="Realtime voice chat">
        <header class="top-bar">
          <div>
            <p class="eyebrow">Gemini Live API</p>
            <h1>Realtime audio chat</h1>
          </div>
          <div class="status-pill" id="status">Idle</div>
        </header>

        <div class="meter-row" aria-hidden="true">
          <span class="meter" id="input-meter"></span>
          <span class="meter meter-output" id="output-meter"></span>
        </div>

        <div class="controls">
          <button class="primary-button" id="start-button" type="button">
            Start voice chat
          </button>
          <button class="secondary-button" id="stop-button" type="button" disabled>
            Stop
          </button>
        </div>

        <form class="text-form" id="text-form">
          <input
            id="text-input"
            type="text"
            autocomplete="off"
            placeholder="Send a text turn while the session is open"
          />
          <button type="submit">Send</button>
        </form>

        <div class="transcript" id="transcript" aria-live="polite">
          <div class="message system">
            Add your API key to <code>.env</code>, run <code>npm install</code>, then start a session.
          </div>
        </div>
      </section>

      <aside class="details-panel" aria-label="Session details">
        <dl>
          <div>
            <dt>Model</dt>
            <dd id="model-name">Loading...</dd>
          </div>
          <div>
            <dt>Input audio</dt>
            <dd>PCM 16-bit, 16 kHz, mono</dd>
          </div>
          <div>
            <dt>Output audio</dt>
            <dd>PCM 16-bit, 24 kHz, mono</dd>
          </div>
          <div>
            <dt>Auth</dt>
            <dd>Server-issued ephemeral token</dd>
          </div>
        </dl>
      </aside>
    </main>

    <script type="module" src="/src/client.ts"></script>
  </body>
</html>
